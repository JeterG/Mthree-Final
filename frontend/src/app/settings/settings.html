<div class="settings-page">

  <!-- HEADER -->
  <div class="settings-header">
    <h2>Settings</h2>
    <p>Customize your experience</p>
  </div>

  <!-- CARD -->
  <div class="settings-card">

    <!-- 🌙 DARK MODE -->
    <div class="setting-row">
      <span>Dark Mode</span>

      <label class="toggle">
        <input
          type="checkbox"
          [(ngModel)]="isDarkMode"
          (change)="toggleTheme()"
        >
        <span class="slider"></span>
      </label>
    </div>

    <!-- ⏰ TIMEZONE -->
    <div class="form-group">
      <label>Timezone</label>
      <select
        [(ngModel)]="selectedTimezone"
        (change)="onTimezoneChange()"
      >
        <option *ngFor="let tz of timezones" [value]="tz.value">
          {{ tz.label }}
        </option>
      </select>
    </div>

    <!-- 🔔 NOTIFICATIONS -->
    <h3 class="section-title">Notifications</h3>

    <div class="setting-row">
      <span>Price Alerts</span>
      <label class="toggle">
        <input
          type="checkbox"
          [(ngModel)]="notifications.priceAlerts"
          (change)="saveNotifications()"
        >
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>Trade Confirmations</span>
      <label class="toggle">
        <input
          type="checkbox"
          [(ngModel)]="notifications.tradeConfirmations"
          (change)="saveNotifications()"
        >
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>Daily Summary</span>
      <label class="toggle">
        <input
          type="checkbox"
          [(ngModel)]="notifications.dailySummary"
          (change)="saveNotifications()"
        >
        <span class="slider"></span>
      </label>
    </div>

  </div>
</div>

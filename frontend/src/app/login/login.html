<div class="login-container">
  <div class="login-card">
    <div class="logo-wrapper">
      <img src="assets/logo.png" class="logo-img" alt="Logo" />
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your StockQuik account!</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <input type="email" placeholder="Email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="form-group">
        <input
          type="password"
          placeholder="Password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <!-- No error divs — all feedback via toast -->

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Login' }}
      </button>
    </form>

    <p class="signup-link">Don't have an account? <a routerLink="/signup">Sign up</a></p>

    <p class="footer">Paper trading. Zero risk. Real experience.</p>
  </div>
</div>

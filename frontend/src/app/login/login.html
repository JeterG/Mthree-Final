<div class="login-container">

  <div class="login-card">

    <!-- LOGO -->
    <div class="logo-wrapper">
      <img src="assets/logo.png" class="logo-img" alt="Logo" />
    </div>

    <!-- TITLE -->
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your StockQuik account!</p>

    <form #loginForm="ngForm" (ngSubmit)="login()">

      <!-- EMAIL -->
      <div class="form-group">
        <input
          type="email"
          placeholder="Email"
          name="email"
          [(ngModel)]="email"
          required
          email
          #emailInput="ngModel"
        />
        <div class="error">
          <span *ngIf="emailInput.invalid && emailInput.touched">
            Please enter a valid email
          </span>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <input
          type="password"
          placeholder="Password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          #passwordInput="ngModel"
        />
        <div class="error">
          <span *ngIf="passwordInput.invalid && passwordInput.touched">
            Password must be at least 6 characters
          </span>
        </div>
      </div>

      <!-- 🔥 MESSAGE AREA (same as signup fix) -->
      <div class="message-area">
        <div class="error" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </div>

      <!-- BUTTON -->
      <button type="submit" [disabled]="loginForm.invalid">
        Login
      </button>

      <!-- LINK -->
      <p class="signup-link">
        Don’t have an account?
        <a routerLink="/signup">Sign up</a>
      </p>

    </form>

    <!-- FOOTER -->
    <p class="footer">Paper trading. Zero risk. Real experience.</p>

  </div>
</div>

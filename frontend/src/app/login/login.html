<div class="login-container">

  <div class="login-card">

    <!-- LOGO -->
    <div class="logo-wrapper">
      <img src="assets/logo.png" class="logo-img" alt="Logo" />
    </div>

    <!-- TITLE -->
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your StockQuik account!</p>

    <form #loginForm="ngForm" (ngSubmit)="login()">

      <!-- EMAIL -->
      <div class="form-group">
        <input
          type="email"
          placeholder="Email"
          name="email"
          [(ngModel)]="email"
        />
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <input
          type="password"
          placeholder="Password"
          name="password"
          [(ngModel)]="password"
        />
      </div>

      <!-- 🔥 ERROR MESSAGE (ONLY AFTER FAILED LOGIN) -->
      <div *ngIf="errorMessage" class="error-message">
  {{ errorMessage }}
</div>

      <!-- BUTTON -->
      <button type="submit">
        Login
      </button>

      <!-- LINK -->
      <p class="signup-link">
        Don’t have an account?
        <a routerLink="/signup">Sign up</a>
      </p>

    </form>

    <!-- FOOTER -->
    <p class="footer">Paper trading. Zero risk. Real experience.</p>

  </div>
</div>

<div class="container py-4">
  <div class="chart-container">
    <!-- Symbol tabs -->
    <div class="d-flex gap-2 mb-3">
      <button
        *ngFor="let s of symbols"
        type="button"
        class="btn"
        [ngClass]="selectedSymbol === s ? 'btn-secondary' : 'btn-light'"
        (click)="selectSymbol(s)"
      >
        {{ s }}
      </button>
    </div>

    <!-- Stock chart -->
    <app-stock-chart [symbol]="selectedSymbol"></app-stock-chart>
  </div>
</div>

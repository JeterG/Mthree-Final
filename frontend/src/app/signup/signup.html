<div class="login-container">
  <div class="login-card">
    <div class="logo-wrapper">
      <img src="assets/logo.png" class="logo-img" alt="Logo" />
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Start paper trading today! 😀</p>

    <form (ngSubmit)="signup()">
      <div class="form-group">
        <input type="email" placeholder="Email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="form-group">
        <input
          type="password"
          placeholder="Password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <div class="form-group">
        <input
          type="password"
          placeholder="Confirm Password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
        />
      </div>

      <!-- No error divs — all feedback via toast -->

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="signup-link">Already have an account? <a routerLink="/login">Login</a></p>

    <p class="footer">Paper trading. Zero risk. Real experience.</p>
  </div>
</div>

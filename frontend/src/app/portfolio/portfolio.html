<div class="container-fluid py-4 px-4">
  <!-- Summary Cards -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm h-100 p-3">
        <p class="text-muted small mb-1">Portfolio Value</p>
        <h4 class="fw-bold mb-0">$0.00</h4>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm h-100 p-3">
        <p class="text-muted small mb-1">Cash Balance</p>
        <h4 class="fw-bold mb-0">$0.00</h4>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm h-100 p-3">
        <p class="text-muted small mb-1">Total Gain / Loss</p>
        <h4 class="fw-bold mb-0">$0.00</h4>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm h-100 p-3">
        <p class="text-muted small mb-1">Holdings</p>
        <h4 class="fw-bold mb-0">0 stocks</h4>
      </div>
    </div>
  </div>

  <!-- Charts Row -->
  <div class="row g-4 mb-4">
    <div class="col-12 col-lg-6">
      <div class="card border-0 shadow-sm h-100 p-3">
        <p class="text-muted small mb-2" *ngIf="!selectedSymbol">
          Search a stock below to view its chart
        </p>
        <app-stock-chart [symbol]="selectedSymbol"></app-stock-chart>
      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="card border-0 shadow-sm h-100 p-3">Portfolio Value Over Time</div>
    </div>
  </div>

  <!-- Stock Search Row -->
  <div class="row g-4 mb-4">
    <div class="col-12 col-lg-6">
      <div class="card border-0 shadow-sm p-3">
        <p class="text-muted small mb-2">Search a stock to view its chart</p>
        <app-stock-search (symbolSelected)="onSymbolSelected($event)"></app-stock-search>
        <p class="mt-2 text-muted small" *ngIf="selectedSymbol">
          Selected: <strong>{{ selectedSymbol }}</strong>
        </p>
      </div>
    </div>
  </div>

  <!-- Table Row -->
  <div class="row g-4">
    <div class="col-12">
      <div class="card border-0 shadow-sm p-3">Holdings / Transactions / Watchlist Table</div>
    </div>
  </div>
</div>

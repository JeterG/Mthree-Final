<div class="chart-container">

  <!-- 🔥 INDEX SELECTOR -->
  <div class="d-flex gap-2 mb-3">
    <button
      *ngFor="let index of indexes"
      type="button"
      class="btn"
      [ngClass]="selectedSymbol === index.symbol ? 'btn-secondary' : 'btn-light'"
      (click)="selectIndex(index.symbol)"
    >
      {{ index.name }}
    </button>
  </div>

  <!-- 🔥 CARD -->
  <div class="card custom-card shadow-sm p-3">

    <!-- 🔥 TITLE (FIXED COLOR) -->
    <h5 class="fw-bold mb-2 text-center chart-title">
      {{ indexes.find(i => i.symbol === selectedSymbol)?.name }}
    </h5>

    <!-- 🔥 RANGE BUTTONS -->
    <div class="w-100 d-flex justify-content-start mb-3">
      <div class="btn-group" role="group">
        <button
          *ngFor="let r of ranges"
          type="button"
          class="btn btn-sm"
          [ngClass]="activeRange === r ? 'btn-primary' : 'btn-outline-secondary'"
          (click)="selectRange(r)"
        >
          {{ r }}
        </button>
      </div>
    </div>

    <!-- 🔥 CHART -->
    <div class="chart-wrapper">
      <canvas id="mainChart"></canvas>
    </div>

  </div>

</div>

<div class="position-relative">

  <!-- Search input -->
  <input
    type="text"
    class="form-control"
    placeholder="Search stocks (e.g. Apple or AAPL)"
    [(ngModel)]="searchQuery"
    (input)="onSearch()"
    (blur)="onBlur()"
  />

  <!-- Dropdown -->
  <div class="dropdown-menu show w-100 shadow-sm" *ngIf="showDropdown">

    <button
      *ngFor="let stock of filteredStocks"
      type="button"
      class="dropdown-item"
      (mousedown)="selectStock(stock)"
    >
      <div class="d-flex flex-column">
        <!-- 🔥 MAIN LINE -->
        <strong>{{ stock.companyName }} ({{ stock.symbol }})</strong>

        <!-- 🔥 SUB LINE -->
        <span class="text-muted small">
          ${{ stock.currentPrice | number: '1.2-2' }}
        </span>
      </div>
    </button>

  </div>

</div>

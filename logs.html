<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperTrade — Logs</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Courier New", monospace;
        background: #0d1117;
        color: #c9d1d9;
        min-height: 100vh;
      }

      header {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        padding: 16px 32px;
      }
      header h1 {
        font-size: 20px;
        color: #f0f6fc;
        font-family: Arial, sans-serif;
      }
      header p {
        font-size: 13px;
        color: #8b949e;
        font-family: Arial, sans-serif;
        margin-top: 4px;
      }

      nav {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        padding: 0 32px;
        display: flex;
        gap: 4px;
        overflow-x: auto;
      }
      nav a {
        display: inline-block;
        padding: 10px 16px;
        font-size: 13px;
        font-family: Arial, sans-serif;
        color: #8b949e;
        text-decoration: none;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      nav a:hover {
        color: #f0f6fc;
      }
      nav a.active {
        color: #58a6ff;
        border-bottom-color: #58a6ff;
      }

      .tabs {
        display: flex;
        gap: 4px;
        padding: 16px 32px 0;
        border-bottom: 1px solid #30363d;
        flex-wrap: wrap;
      }
      .tab-btn {
        padding: 8px 16px;
        border: 1px solid #30363d;
        border-bottom: none;
        border-radius: 6px 6px 0 0;
        background: #161b22;
        color: #8b949e;
        cursor: pointer;
        font-size: 12px;
        font-family: Arial, sans-serif;
      }
      .tab-btn:hover {
        background: #21262d;
        color: #c9d1d9;
      }
      .tab-btn.active {
        background: #0d1117;
        color: #f0f6fc;
        border-bottom: 1px solid #0d1117;
        margin-bottom: -1px;
      }
      .tab-btn[data-tab="backend"].active {
        color: #56d364;
      }
      .tab-btn[data-tab="frontend"].active {
        color: #58a6ff;
      }
      .tab-btn[data-tab="sql"].active {
        color: #f9a825;
      }
      .tab-btn[data-tab="docker"].active {
        color: #79c0ff;
      }
      .tab-btn[data-tab="cloudflare"].active {
        color: #e36209;
      }
      .tab-btn[data-tab="ngrok"].active {
        color: #bc8cff;
      }
      .tab-btn[data-tab="session"].active {
        color: #c9d1d9;
      }

      .log-panel {
        display: none;
        padding: 20px 32px;
      }
      .log-panel.active {
        display: block;
      }

      .log-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .log-meta {
        font-size: 12px;
        font-family: Arial, sans-serif;
        color: #8b949e;
      }
      .file-path {
        color: #58a6ff;
      }
      .status-ok {
        color: #56d364;
        margin-left: 10px;
      }
      .status-err {
        color: #ff7b72;
        margin-left: 10px;
      }

      .log-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .search-bar {
        padding: 5px 10px;
        width: 220px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #c9d1d9;
        font-size: 12px;
        font-family: "Courier New", monospace;
      }
      .search-bar:focus {
        outline: none;
        border-color: #58a6ff;
      }
      .btn-sm {
        padding: 4px 12px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #21262d;
        color: #c9d1d9;
        cursor: pointer;
        font-size: 12px;
        font-family: Arial, sans-serif;
      }
      .btn-sm:hover {
        background: #30363d;
      }
      .btn-refresh {
        border-color: #388bfd44;
        color: #58a6ff;
      }
      .btn-refresh:hover {
        background: #388bfd22;
      }

      .log-output {
        background: #010409;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 16px;
        height: 540px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .line {
        display: block;
      }
      .line.error {
        color: #ff7b72;
      }
      .line.warn {
        color: #d29922;
      }
      .line.success {
        color: #56d364;
      }
      .line.info {
        color: #58a6ff;
      }
      .line.debug {
        color: #8b949e;
      }
      .line.sql {
        color: #f9a825;
      }
      .line.sep {
        color: #21262d;
      }
      .line.session-start {
        color: #79c0ff;
        font-weight: bold;
      }

      .empty-state {
        color: #8b949e;
        font-family: Arial, sans-serif;
        font-size: 13px;
        padding: 60px 20px;
        text-align: center;
        line-height: 2.2;
      }
      .empty-state code {
        color: #58a6ff;
        background: #161b22;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📋 PaperTrade — Log Viewer</h1>
      <p>
        Reads directly from <code>logs/</code> in the same directory.
        Auto-refreshes every 10s.
      </p>
    </header>

    <nav>
      <a href="index.html">← Docs</a>
      <a href="index.html#architecture">Architecture</a>
      <a href="index.html#auth-flow">Auth Flow</a>
      <a href="index.html#transaction-flow">Transactions</a>
      <a href="index.html#erd">ERD</a>
      <a href="logs.html" class="active">📋 Logs</a>
    </nav>

    <div class="tabs">
      <button
        class="tab-btn active"
        data-tab="backend"
        onclick="showTab('backend')"
      >
        ⚙️ Backend
      </button>
      <button class="tab-btn" data-tab="frontend" onclick="showTab('frontend')">
        🌐 Frontend
      </button>
      <button class="tab-btn" data-tab="sql" onclick="showTab('sql')">
        🗄️ SQL
      </button>
      <button class="tab-btn" data-tab="docker" onclick="showTab('docker')">
        🐳 Docker
      </button>
      <button
        class="tab-btn"
        data-tab="cloudflare"
        onclick="showTab('cloudflare')"
      >
        ☁️ Cloudflare
      </button>
      <button class="tab-btn" data-tab="ngrok" onclick="showTab('ngrok')">
        🔗 ngrok
      </button>
      <button class="tab-btn" data-tab="session" onclick="showTab('session')">
        📅 Session
      </button>
    </div>

    <div
      id="panel-backend"
      class="log-panel active"
      data-file="logs/backend.log"
    ></div>
    <div
      id="panel-frontend"
      class="log-panel"
      data-file="logs/frontend.log"
    ></div>
    <div id="panel-sql" class="log-panel" data-file="logs/sql.log"></div>
    <div id="panel-docker" class="log-panel" data-file="logs/docker.log"></div>
    <div
      id="panel-cloudflare"
      class="log-panel"
      data-file="logs/cloudflare.log"
    ></div>
    <div id="panel-ngrok" class="log-panel" data-file="logs/ngrok.log"></div>
    <div
      id="panel-session"
      class="log-panel"
      data-file="logs/session.log"
    ></div>

    <script>
      const rawLogs = {};
      const tabs = [
        "backend",
        "frontend",
        "sql",
        "docker",
        "cloudflare",
        "ngrok",
        "session",
      ];

      // Build each panel's inner HTML
      tabs.forEach((name) => {
        const panel = document.getElementById(`panel-${name}`);
        const file = panel.dataset.file;
        panel.innerHTML = `
      <div class="log-toolbar">
        <div class="log-meta">
          <span class="file-path">${file}</span>
          <span id="status-${name}"></span>
        </div>
        <div class="log-actions">
          <input type="text" class="search-bar" id="search-${name}"
            placeholder="Search..." oninput="filterLog('${name}', this.value)" />
          <button class="btn-sm btn-refresh" onclick="loadLog('${name}')">↻ Refresh</button>
          <button class="btn-sm" onclick="scrollBottom('${name}')">↓ Bottom</button>
        </div>
      </div>
      <div id="output-${name}" class="log-output">
        <div class="empty-state">Loading <code>${file}</code>…</div>
      </div>`;
      });

      function showTab(name) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document
          .querySelectorAll(".log-panel")
          .forEach((p) => p.classList.remove("active"));
        document.querySelector(`[data-tab="${name}"]`).classList.add("active");
        document.getElementById(`panel-${name}`).classList.add("active");
        if (!rawLogs[name]) loadLog(name);
      }

      function loadLog(name) {
        const panel = document.getElementById(`panel-${name}`);
        const file = panel.dataset.file;
        const status = document.getElementById(`status-${name}`);

        fetch(`./${file}?_=${Date.now()}`)
          .then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.text();
          })
          .then((text) => {
            rawLogs[name] = text;
            const query = document.getElementById(`search-${name}`).value;
            const display = query
              ? text
                  .split("\n")
                  .filter((l) => l.toLowerCase().includes(query.toLowerCase()))
                  .join("\n")
              : text;
            renderLog(name, display);
            status.className = "status-ok";
            status.textContent = `✓ ${text.split("\n").length.toLocaleString()} lines`;
          })
          .catch((e) => {
            rawLogs[name] = null;
            document.getElementById(`output-${name}`).innerHTML = `
          <div class="empty-state">
            Could not load <code>${file}</code><br>
            Start prod.sh first so the log file exists.<br><br>
            <small style="color:#555">${e.message}</small>
          </div>`;
            status.className = "status-err";
            status.textContent = "✗ not found";
          });
      }

      function renderLog(name, text) {
        const output = document.getElementById(`output-${name}`);
        if (!text || !text.trim()) {
          output.innerHTML = '<div class="empty-state">File is empty.</div>';
          return;
        }
        output.innerHTML = text.split("\n").map(colorize).join("");
        output.scrollTop = output.scrollHeight;
      }

      function colorize(line) {
        const l = line.toLowerCase();
        let cls = "";
        if (line.startsWith("━")) cls = "sep";
        else if (l.includes("session start")) cls = "session-start";
        else if (l.match(/error|exception|failed|fatal|❌/)) cls = "error";
        else if (l.match(/warn|warning/)) cls = "warn";
        else if (l.match(/✅|success|started|ready|running|seeded|connected/))
          cls = "success";
        else if (
          l.match(
            /\bselect\b|\binsert\b|\bupdate\b|\bdelete\b|\bcreate table\b/,
          )
        )
          cls = "sql";
        else if (l.match(/info|\bget\b|\bpost\b|\bput\b|\bhttp\b|🌐|🚀/))
          cls = "info";
        else if (l.match(/debug|trace/)) cls = "debug";
        const escaped = line
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        return `<span class="line ${cls}">${escaped}\n</span>`;
      }

      function filterLog(name, query) {
        const raw = rawLogs[name];
        if (!raw) return;
        const filtered = query
          ? raw
              .split("\n")
              .filter((l) => l.toLowerCase().includes(query.toLowerCase()))
              .join("\n")
          : raw;
        renderLog(name, filtered);
      }

      function scrollBottom(name) {
        document.getElementById(`output-${name}`).scrollTop = 999999;
      }

      // Load first tab immediately
      loadLog("backend");

      // Auto-refresh active tab every 10s
      setInterval(() => {
        const active = document.querySelector(".tab-btn.active");
        if (active) loadLog(active.dataset.tab);
      }, 10000);
    </script>
  </body>
</html>
